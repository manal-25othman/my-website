# نشر الموقع على GitHub Pages عبر فرع gh-pages.
#
# لماذا هذه الطريقة؟ الطريقة الرسمية (actions/deploy-pages) تتطلب أن تكون
# خدمة Pages مفعّلة مسبقاً من الإعدادات، ولا يمكن تفعيلها من داخل الـ workflow.
# أما دفع مجلد البناء إلى فرع اسمه gh-pages فيدفع GitHub غالباً إلى إنشاء
# موقع Pages تلقائياً — بلا أي خطوة يدوية.
#
# إن لم يُنشأ الموقع تلقائياً، تبقى خطوة واحدة:
#     Settings → Pages → Source: Deploy from a branch → gh-pages / (root)
#
# ملاحظة: لا نثبّت اسم الفرع المصدر (main / master / …) — يُقارَن الفرع
# المدفوع بالفرع الافتراضي للمستودع، فيعمل مهما كان اسمه.
name: Deploy site

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # مطلوبة لدفع الناتج إلى فرع gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # ينشر من الفرع الافتراضي فقط (أو عند التشغيل اليدوي)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # المشروع بلا اعتماديات — لا حاجة لـ npm install
      - name: Build
        env:
          # لدومين خاص: SITE_URL=https://yourdomain.com و BASE_PATH فارغ
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: node build.js

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # .nojekyll يمنع GitHub من تمرير الملفات على Jekyll
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          # الفرع ناتج بناء بالكامل، فالدفع القسري هو السلوك الصحيح هنا
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "✅ نُشر إلى فرع gh-pages"
          echo "🔗 https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
