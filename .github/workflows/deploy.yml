# نشر الموقع تلقائياً على GitHub Pages عند كل دفعة إلى الفرع الافتراضي.
# فعّله مرة واحدة من:  Settings → Pages → Source: GitHub Actions
#
# ملاحظة: لا نثبّت اسم الفرع (main / master / …) — يُقارَن الفرع المدفوع
# بالفرع الافتراضي للمستودع، فيعمل النشر مهما كان اسمه، ولا يُنشر من
# فروع العمل الأخرى. ويمكن دائماً التشغيل يدوياً من تبويب Actions.
name: Deploy site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # ينشر من الفرع الافتراضي فقط (أو عند التشغيل اليدوي)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # المشروع بلا اعتماديات — لا حاجة لـ npm install
      - name: Build
        env:
          # اضبط SITE_URL و BASE_PATH في content/site.js أو هنا.
          # لدومين خاص: SITE_URL=https://yourdomain.com و BASE_PATH فارغ.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: node build.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
