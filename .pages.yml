            label: المقدمة
            type: object
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }
          - name: sections
            label: الأقسام
            type: object
            list: true
            fields:
              - name: heading
                label: العنوان
