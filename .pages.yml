# ═══════════════════════════════════════════════════════════════════════════
#  لوحة تحكم الموقع  —  Pages CMS  (app.pagescms.org)
# ═══════════════════════════════════════════════════════════════════════════
#  ⚠️ هذا الملف يصف حقول لوحة التحكم. أي حقل غير مذكور هنا قد يُحذف عند
#     الحفظ من اللوحة — فإذا أضفتِ حقلًا جديدًا في ملفات JSON، أضيفيه هنا.
# ═══════════════════════════════════════════════════════════════════════════

media:
  - name: images
    label: الصور
    input: src/assets/img
    output: img
    extensions: [png, jpg, jpeg, webp, svg]

  - name: files
    label: الملفات (السيرة الذاتية)
    input: src/assets/files
    output: files
    extensions: [pdf]

content:
  # ─────────────────────────────────────────────────────────────────────
  #  ١ · الهوية
  # ─────────────────────────────────────────────────────────────────────
  - name: identity
    label: الهوية والحسابات
    type: file
    path: content/site.json
    icon: user
    fields:
      - name: profile
        label: الهوية الشخصية
        type: object
        fields:
          - name: name
            label: الاسم الكامل
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: professionalTitle
            label: المسمى المهني
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: secondaryTitle
            label: المسمى الفرعي
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: headline
            label: عنوان الهيرو الرئيسي
            type: object
            description: جملة القيمة التي تظهر بأكبر خط في الصفحة الرئيسية
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }
          - name: supporting
            label: النص المساند
            type: object
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }
          - name: keywordsLine
            label: سطر الكلمات المفتاحية
            type: object
            description: 'مثال: Generative AI · RAG · AI Agents · SaaS'
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: shortBio
            label: نبذة قصيرة
            type: object
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }
          - name: longBio
            label: نبذة موسّعة
            type: object
            description: كل عنصر فقرة مستقلة
            fields:
              - { name: ar, label: فقرات بالعربية, type: text, list: true }
              - { name: en, label: فقرات بالإنجليزية, type: text, list: true }
          - name: photo
            label: الصورة الشخصية
            type: image
            description: مربعة 800×800 — استخدمي نفس صورتك في LinkedIn و TikTok
          - name: photoAlt
            label: وصف الصورة
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - { name: ogImage, label: صورة المشاركة (1200×630), type: image }
          - { name: email, label: البريد الإلكتروني, type: string }
          - name: location
            label: الموقع الجغرافي
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: availability
            label: حالة التوفّر
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: cvUrl
            label: ملف السيرة الذاتية (PDF)
            type: file
            description: ارفعي السيرة بصيغة PDF ليعمل زر «تحميل السيرة الذاتية»
          - name: social
            label: الحسابات الرسمية
            type: object
            list: true
            description: الحساب الذي له رابط فقط يُرسَل لمحركات البحث كإشارة هوية
            fields:
              - name: id
                label: المنصة
                type: select
                options:
                  values: [linkedin, tiktok, github, x, email]
              - name: label
                label: الاسم المعروض
                type: object
                fields:
                  - { name: ar, label: بالعربية, type: string }
                  - { name: en, label: بالإنجليزية, type: string }
              - { name: handle, label: اسم المستخدم, type: string }
              - { name: url, label: الرابط الكامل, type: string }
              - { name: primary, label: حساب رئيسي, type: boolean }

      - { name: url, label: دومين الموقع, type: string }
      - { name: basePath, label: مسار فرعي, type: string }

      - name: languages
        label: اللغات
        type: object
        list: true
        fields:
          - { name: code, label: الرمز, type: string }
          - { name: label, label: الاسم, type: string }
          - { name: dir, label: الاتجاه, type: select, options: { values: [rtl, ltr] } }
          - { name: locale, label: locale, type: string }
          - { name: prefix, label: بادئة الرابط, type: string }

      - name: seo
        label: إعدادات محركات البحث
        type: object
        fields:
          - name: homeTitle
            label: عنوان الصفحة الرئيسية
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: description
            label: وصف الموقع
            type: object
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }
          - name: keywords
            label: الكلمات المفتاحية
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string, list: true }
              - { name: en, label: بالإنجليزية, type: string, list: true }
          - { name: googleSiteVerification, label: كود تحقق Google, type: string }

      - name: analytics
        label: التحليلات
        type: object
        fields:
          - { name: googleAnalyticsId, label: Google Analytics, type: string }
          - { name: tiktokPixelId, label: TikTok Pixel, type: string }
          - { name: respectDoNotTrack, label: احترام Do Not Track, type: boolean }

      - name: contactForm
        label: نموذج التواصل
        type: object
        fields:
          - { name: mode, label: طريقة الإرسال, type: select, options: { values: [mailto, endpoint] } }
          - { name: endpoint, label: رابط الخدمة الخارجية, type: string }

      - { name: copyrightStartYear, label: سنة بداية حقوق النشر, type: number }

  # ─────────────────────────────────────────────────────────────────────
  #  ٢ · المشاريع  —  أهم قسم في الموقع
  # ─────────────────────────────────────────────────────────────────────
  - name: projects
    label: المشاريع
    type: file
    path: content/projects.json
    icon: folder
    list: true
    fields:
      - name: name
        label: اسم المشروع
        type: object
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - name: slug
        label: معرّف الرابط
        type: string
        description: إنجليزي بلا مسافات — لا تغيّريه بعد النشر
      - name: featured
        label: المشروع الأبرز
        type: boolean
        description: مشروع واحد فقط — يُعرض كدراسة حالة كاملة أعلى الصفحة
      - { name: year, label: السنة, type: string }
      - name: tagline
        label: سطر تعريفي
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text }
          - { name: en, label: بالإنجليزية, type: text }
      - { name: categories, label: التصنيفات, type: string, list: true }
      - name: role
        label: دورك في المشروع
        type: object
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - name: summary
        label: وصف مختصر
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text }
          - { name: en, label: بالإنجليزية, type: text }
      - name: problem
        label: المشكلة
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text }
          - { name: en, label: بالإنجليزية, type: text }
      - name: solution
        label: الحل
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text }
          - { name: en, label: بالإنجليزية, type: text }
      - name: highlights
        label: أبرز ما تم العمل عليه
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text, list: true }
          - { name: en, label: بالإنجليزية, type: text, list: true }
      - name: metrics
        label: أرقام المشروع
        type: object
        list: true
        description: أرقام حقيقية فقط — تظهر بارزة أعلى دراسة الحالة
        fields:
          - { name: value, label: القيمة, type: string }
          - name: label
            label: الوصف
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
      - { name: stack, label: التقنيات, type: string, list: true }
      - name: results
        label: النتيجة
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text, list: true }
          - { name: en, label: بالإنجليزية, type: text, list: true }
      - { name: image, label: صورة المشروع, type: image }
      - { name: url, label: رابط المشروع, type: string }

  # ─────────────────────────────────────────────────────────────────────
  #  ٣ · المقالات (عربي)
  # ─────────────────────────────────────────────────────────────────────
  #  كل مقال ملف Markdown مستقل. اسم الملف هو رابط المقال، فاكتبيه
  #  بحروف لاتينية بلا مسافات: rag-explained ← /articles/rag-explained/
  #  المقال لا يظهر في الموقع ما دام «مسودة» مفعّلًا.
  # ─────────────────────────────────────────────────────────────────────
  - name: articles_ar
    label: المقالات (عربي)
    type: collection
    path: content/articles/ar
    filename: '{fields.slug}.md'
    format: yaml-frontmatter
    icon: file-text
    exclude: ['_template.md']
    view:
      fields: [title, date, category, draft]
      primary: title
      sort: [date, title]
    fields:
      - name: slug
        label: معرّف الرابط
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: 'حروف لاتينية صغيرة وشرطات فقط: rag-explained ← /articles/rag-explained/ — لا تغيّريه بعد النشر'
      - name: title
        label: عنوان المقال
        type: string
        required: true
        description: يصبح العنوان الرئيسي للصفحة — أبقيه تحت ٦٠ حرفًا
      - name: description
        label: وصف الميتا
        type: text
        description: السطر الذي يظهر في نتائج جوجل — حتى ١٥٨ حرفًا. إن تركتِه فارغًا يُشتق من أول فقرة
      - name: date
        label: تاريخ النشر
        type: date
        required: true
        options: { format: 'yyyy-MM-dd' }
      - name: updated
        label: تاريخ آخر تعديل
        type: date
        options: { format: 'yyyy-MM-dd' }
        description: املئيه فقط عند تعديل جوهري — وإلا اتركيه فارغًا
      - name: category
        label: التصنيف
        type: select
        required: true
        options:
          values:
            - { value: generative-ai, label: الذكاء الاصطناعي التوليدي }
            - { value: ai-engineering, label: هندسة الذكاء الاصطناعي }
            - { value: digital-products, label: المنتجات الرقمية }
      - name: tags
        label: الوسوم
        type: string
        list: true
        description: من صفر إلى خمسة — أعيدي استخدام الوسوم نفسها قدر الإمكان
      - name: cover
        label: اسم صورة الغلاف
        type: string
        description: 'الاسم فقط بلا امتداد ولا مقاس. ارفعي ثلاث نسخ في src/assets/img/articles/ بالأسماء: {الاسم}-800.jpg و -1200.jpg و -1600.jpg'
      - name: coverAlt
        label: النص البديل للصورة
        type: string
        description: مطلوب إن وُجدت صورة — بدونه يتوقف البناء
      - name: draft
        label: مسودة
        type: boolean
        default: true
        description: ما دام مفعّلًا لا يظهر المقال في الموقع إطلاقًا
      - name: body
        label: نص المقال
        type: rich-text
        description: ابدئي بـ ## وليس # — العنوان الرئيسي يأتي من حقل العنوان أعلاه

  # ─────────────────────────────────────────────────────────────────────
  #  ٤ · المقالات (إنجليزي)
  # ─────────────────────────────────────────────────────────────────────
  #  اختياري تمامًا. لربط ترجمة بمقال عربي، استخدمي اسم الملف نفسه.
  #  بلا ترجمة لا يعلن الموقع عن نسخة إنجليزية أصلًا — وهذا مقصود.
  # ─────────────────────────────────────────────────────────────────────
  - name: articles_en
    label: المقالات (إنجليزي)
    type: collection
    path: content/articles/en
    filename: '{fields.slug}.md'
    format: yaml-frontmatter
    icon: file-text
    exclude: ['_README.md']
    view:
      fields: [title, date, category, draft]
      primary: title
      sort: [date, title]
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: Use the SAME slug as the Arabic article to pair them as translations
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Meta description, type: text }
      - name: date
        label: Publish date
        type: date
        required: true
        options: { format: 'yyyy-MM-dd' }
      - name: updated
        label: Last updated
        type: date
        options: { format: 'yyyy-MM-dd' }
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - { value: generative-ai, label: Generative AI }
            - { value: ai-engineering, label: AI Engineering }
            - { value: digital-products, label: Digital Products }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: cover, label: Cover image name, type: string }
      - { name: coverAlt, label: Cover alt text, type: string }
      - { name: draft, label: Draft, type: boolean, default: true }
      - name: body
        label: Body
        type: rich-text
        description: Start at ## — the H1 comes from the title field

  # ─────────────────────────────────────────────────────────────────────
  #  ٥ · من أنا
  # ─────────────────────────────────────────────────────────────────────
  - name: about
    label: من أنا
    type: file
    path: content/about.json
    icon: id-card
    fields:
      - name: stats
        label: شريط الإثبات
        type: object
        list: true
        description: أربع بطاقات تظهر أسفل الهيرو مباشرة
        fields:
          - name: label
            label: العنوان
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: text
            label: القيمة (نص)
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - { name: value, label: القيمة (رقم), type: number }
          - { name: suffix, label: لاحقة, type: string }

      - name: aboutParagraphs
        label: فقرات «من أنا»
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text, list: true }
          - { name: en, label: بالإنجليزية, type: text, list: true }

      - name: mission
        label: الاقتباس المميّز
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text }
          - { name: en, label: بالإنجليزية, type: text }

      - name: whatIDo
        label: ماذا أفعل
        type: object
        list: true
        fields:
          - name: icon
            label: الأيقونة
            type: select
            options:
              values: [spark, layers, flow, chip, pulse, share, shield, book]
          - name: label
            label: العنوان
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: note
            label: الوصف
            type: object
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }

      - name: whyMe
        label: لماذا منال
        type: object
        fields:
          - name: lead
            label: النص التمهيدي
            type: object
            fields:
              - { name: ar, label: فقرات بالعربية, type: text, list: true }
              - { name: en, label: فقرات بالإنجليزية, type: text, list: true }
          - name: cards
            label: البطاقات الأربع
            type: object
            list: true
            fields:
              - name: icon
                label: الأيقونة
                type: select
                options:
                  values: [chip, spark, flow, share, layers, shield]
              - name: title
                label: العنوان
                type: object
                fields:
                  - { name: ar, label: بالعربية, type: string }
                  - { name: en, label: بالإنجليزية, type: string }
              - name: note
                label: الوصف
                type: object
                fields:
                  - { name: ar, label: بالعربية, type: text }
                  - { name: en, label: بالإنجليزية, type: text }

      - name: career
        label: إلى أين أتجه
        type: object
        fields:
          - name: title
            label: العنوان
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: body
            label: النص
            type: object
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }

      - name: education
        label: التعليم
        type: object
        list: true
        fields:
          - name: degree
            label: الدرجة والتخصص
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: institution
            label: الجهة التعليمية
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: period
            label: الفترة
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: note
            label: ملاحظة
            type: object
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }

      - name: certifications
        label: الشهادات والتدريب
        type: object
        list: true
        fields:
          - name: name
            label: اسم الشهادة
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: issuer
            label: الجهة المانحة
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - { name: year, label: السنة, type: string }
          - { name: credentialUrl, label: رابط التحقق, type: string }

      - name: contributions
        label: محاضرات ومشاركات
        type: object
        fields:
          - name: title
            label: عنوان القسم
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: lead
            label: الوصف
            type: object
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }
          - name: items
            label: المشاركات
            type: object
            list: true
            fields:
              - name: title
                label: عنوان المشاركة
                type: object
                fields:
                  - { name: ar, label: بالعربية, type: string }
                  - { name: en, label: بالإنجليزية, type: string }
              - name: org
                label: الجهة
                type: object
                fields:
                  - { name: ar, label: بالعربية, type: string }
                  - { name: en, label: بالإنجليزية, type: string }
              - name: url
                label: رابط التغطية الإعلامية
                type: string
                description: رابط خبر أو تغطية للمشاركة — اختياري

  # ─────────────────────────────────────────────────────────────────────
  #  ٤ · الخبرة المهنية
  # ─────────────────────────────────────────────────────────────────────
  - name: experience
    label: الخبرة المهنية
    type: file
    path: content/experience.json
    icon: briefcase
    list: true
    fields:
      - name: organization
        label: جهة العمل
        type: object
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - name: role
        label: المسمى الوظيفي
        type: object
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - { name: startDate, label: تاريخ البداية, type: string }
      - { name: endDate, label: تاريخ النهاية, type: string }
      - name: period
        label: الفترة (نص معروض)
        type: object
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - { name: current, label: الوظيفة الحالية, type: boolean }
      - name: location
        label: الموقع
        type: object
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - name: summary
        label: ملخّص الدور
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text }
          - { name: en, label: بالإنجليزية, type: text }
      - name: responsibilities
        label: المسؤوليات
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text, list: true }
          - { name: en, label: بالإنجليزية, type: text, list: true }
      - name: achievements
        label: أبرز الإنجازات
        type: object
        description: أرقام حقيقية قابلة للتحقق فقط
        fields:
          - { name: ar, label: بالعربية, type: text, list: true }
          - { name: en, label: بالإنجليزية, type: text, list: true }
      - { name: stack, label: الأدوات والتقنيات, type: string, list: true }

  # ─────────────────────────────────────────────────────────────────────
  #  ٥ · المهارات
  # ─────────────────────────────────────────────────────────────────────
  - name: expertise
    label: المهارات
    type: file
    path: content/expertise.json
    icon: layers
    list: true
    fields:
      - { name: id, label: المعرّف, type: string }
      - name: icon
        label: الأيقونة
        type: select
        options:
          values: [spark, chip, shield, layers, share, flow, pulse]
      - { name: feature, label: مجموعة أساسية (تُعرض أكبر), type: boolean }
      - name: title
        label: العنوان
        type: object
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - name: intro
        label: الوصف
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text }
          - { name: en, label: بالإنجليزية, type: text }
      - name: items
        label: المهارات
        type: object
        list: true
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }

  # ─────────────────────────────────────────────────────────────────────
  #  ٦ · المنشورات
  # ─────────────────────────────────────────────────────────────────────
  - name: publications
    label: المنشورات
    type: file
    path: content/publications.json
    icon: file-text
    fields:
      - name: title
        label: عنوان القسم
        type: object
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - name: lead
        label: وصف القسم
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text }
          - { name: en, label: بالإنجليزية, type: text }
      - name: items
        label: المنشورات
        type: object
        list: true
        fields:
          - name: type
            label: النوع
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: title
            label: العنوان
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: venue
            label: جهة النشر
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: description
            label: الوصف
            type: object
            fields:
              - { name: ar, label: بالعربية, type: text }
              - { name: en, label: بالإنجليزية, type: text }
          - name: icon
            label: الأيقونة
            type: select
            options:
              values: [quote, book, share, spark]
          - name: cta
            label: نص الزر
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - name: url
            label: الرابط
            type: string
            description: أضيفي الرابط ليتحوّل النص إلى زر فعّال
          - { name: urlTodo, label: 'ملاحظة داخلية (اسم الرابط الناقص)', type: string }

  # ─────────────────────────────────────────────────────────────────────
  #  ٧ · المحتوى التقني (TikTok)
  # ─────────────────────────────────────────────────────────────────────
  - name: tiktok
    label: المحتوى التقني
    type: file
    path: content/tiktok.json
    icon: video
    fields:
      - { name: enabled, label: إظهار القسم, type: boolean }
      - { name: handle, label: اسم المستخدم, type: string }
      - name: profileUrl
        label: رابط حساب TikTok
        type: string
        description: مطلوب ليعمل زر «شاهد محتواي على TikTok»
      - name: audience
        label: حجم الجمهور
        type: object
        description: 'مثال: 20K+'
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - name: audienceLabel
        label: وصف الجمهور
        type: object
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - name: bio
        label: نص القسم
        type: object
        fields:
          - { name: ar, label: بالعربية, type: text }
          - { name: en, label: بالإنجليزية, type: text }
      - { name: followers, label: عدد المتابعين (رقم), type: number }
      - { name: likes, label: عدد الإعجابات (رقم), type: number }
      - name: topics
        label: المواضيع
        type: object
        list: true
        fields:
          - { name: ar, label: بالعربية, type: string }
          - { name: en, label: بالإنجليزية, type: string }
      - name: videos
        label: المقاطع المميزة
        type: object
        list: true
        fields:
          - { name: url, label: رابط المقطع, type: string }
          - name: title
            label: العنوان
            type: object
            fields:
              - { name: ar, label: بالعربية, type: string }
              - { name: en, label: بالإنجليزية, type: string }
          - { name: topic, label: الموضوع, type: string }

